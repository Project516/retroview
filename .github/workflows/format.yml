name: Format

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  clang-format:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7

    # Pinned so a new clang-format release cannot reformat the tree in CI.
    - name: Install clang-format
      run: sudo apt-get install -y clang-format-18

    - name: Check formatting
      run: ./format.sh --check